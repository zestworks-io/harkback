<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Harkback · Settings</title>
    <link rel="stylesheet" href="../../lib/ui/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      /* Chrome gives extension pages body { font-size: 75% }; set the size here, not on :root. */
      body {
        margin: 0;
        font: 14px/1.55 var(--sans);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 24px 120px;
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }

      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0;
      }
      .head-tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .head-tools a {
        white-space: nowrap;
        margin-right: 4px;
      }
      .head-tools select {
        width: auto;
        min-width: 104px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
        overflow-x: auto;
      }
      .tab {
        height: auto;
        padding: 10px 14px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        margin-bottom: -1px;
      }
      .tab:hover {
        background: none;
        color: var(--fg);
      }
      .tab[aria-selected="true"] {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      .tab-panel[hidden] {
        display: none;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .card-head {
        padding: 20px 24px 0;
      }
      .card-head h2 {
        font-size: 16px;
        letter-spacing: -0.01em;
        margin: 0 0 2px;
      }
      .card-head p {
        color: var(--muted);
        margin: 0;
      }
      .card-body {
        padding: 20px 24px 24px;
        display: grid;
        gap: 12px;
      }
      .card-foot {
        border-top: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .field > span {
        font-size: 13px;
        font-weight: 500;
      }
      .field.wide {
        grid-column: 1 / -1;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .grid > .field {
        align-content: end;
      }
      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      input[type="text"],
      input[type="password"],
      input[type="number"],
      select {
        width: 100%;
        height: 36px;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
      }
      select {
        padding-right: 6px;
      }
      .secret {
        display: flex;
        gap: 8px;
      }
      .secret input {
        flex: 1;
        min-width: 0;
      }
      .secret .reveal {
        min-width: 64px;
      }
      input::placeholder {
        color: var(--muted);
      }
      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="number"]:focus,
      select:focus {
        outline: none;
        border-color: var(--fg);
        box-shadow: 0 0 0 3px var(--ring);
      }

      button {
        font: inherit;
        font-weight: 500;
        height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        white-space: nowrap;
      }
      button:hover {
        background: var(--subtle);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--fg));
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      button.ghost:hover {
        background: var(--subtle);
        color: var(--err);
      }
      button.small {
        height: 32px;
        padding: 0 12px;
      }
      button.add {
        width: 100%;
        border-style: dashed;
        color: var(--muted);
      }
      .hb-ocr-langs {
        display: grid;
        gap: 12px;
      }
      .hb-ocr-note,
      .hb-ocr-message {
        margin: 0;
        color: var(--muted);
      }
      .hb-ocr-message:empty {
        display: none;
      }
      .hb-ocr-langs {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
      .hb-ocr-note,
      .hb-ocr-message {
        grid-column: 1 / -1;
      }
      .hb-ocr-row {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "name action" "size action";
        column-gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .hb-ocr-name {
        grid-area: name;
        font-weight: 500;
      }
      .hb-ocr-size {
        grid-area: size;
        color: var(--muted);
        font-size: 12px;
      }
      .hb-ocr-row button {
        grid-area: action;
      }

      .item {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        display: grid;
        gap: 14px;
      }
      .item-foot {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .item-foot .spacer {
        flex: 1;
      }
      .choice {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
        color: var(--muted);
      }
      .choice input {
        margin: 0;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .choice:has(input:checked) {
        color: var(--fg);
      }
      a {
        text-decoration-color: var(--accent);
      }

      .site {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .site .pattern {
        flex: 1 1 200px;
      }
      .site select {
        width: auto;
        min-width: 120px;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 16px 0;
        margin: 0;
      }
      .result {
        white-space: pre-wrap;
        font-size: 13px;
        margin: 0;
      }
      .result:empty {
        display: none;
      }
      .result[data-spin]::before {
        content: "";
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-right: 0.6em;
        vertical-align: -0.12em;
        border: 2px solid var(--muted);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .result[data-spin]::before {
          animation: none;
        }
      }
      .item .result {
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--subtle);
      }
      .note {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }
      .privacy {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
        font-size: 13px;
        display: grid;
        gap: 6px;
      }

      .savebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--border);
      }
      .savebar-inner {
        max-width: 800px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .savebar .result {
        flex: 1;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        main {
          padding: 24px 16px 120px;
        }
        .card-head,
        .card-body,
        .card-foot {
          padding-left: 16px;
          padding-right: 16px;
        }
        .grid,
        .grid.four {
          grid-template-columns: 1fr;
        }
        .savebar-inner {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
