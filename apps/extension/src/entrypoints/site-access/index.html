<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harkback</title>
    <link rel="stylesheet" href="../../lib/ui/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      /* Chrome gives extension pages body { font-size: 75% }; set the size here, not on :root. */
      body {
        margin: 0;
        font: 14px/1.55 var(--sans);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 520px;
        margin: 12vh auto 0;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      @media (max-width: 560px) {
        main {
          margin: 16px;
        }
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 10px;
        overflow-wrap: anywhere;
      }
      p {
        margin: 0 0 10px;
      }
      .note {
        color: var(--muted);
        font-size: 13px;
      }
      .status:empty {
        display: none;
      }
      .status {
        color: var(--err);
        font-size: 13px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        font: inherit;
        font-weight: 500;
        height: 34px;
        padding: 0 14px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
      }
      button:hover {
        background: var(--subtle);
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 88%, var(--fg));
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
