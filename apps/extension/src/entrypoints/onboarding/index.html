<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harkback</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f6f7f5; --ink: #1c2433; --muted: #5b6475; --rule: #d6dbe2; --field: #ffffff;
        --mark: #2e4bd6; --mark-soft: rgba(46, 75, 214, 0.08); --ok: #2f7a4a; --err: #b3261e;
        --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --serif: Charter, "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #141922; --ink: #e3e8ef; --muted: #98a2b3; --rule: #2c3442; --field: #1b212c;
          --mark: #8ea2ff; --mark-soft: rgba(142, 162, 255, 0.1); --ok: #6cc38a; --err: #ff8a80;
        }
      }
      * { box-sizing: border-box; }
      /* Chrome gives extension pages body { font-size: 75% }; set the size here, not on :root. */
      body { margin: 0; font: 15px/1.6 var(--sans); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
      main { max-width: 760px; margin: 0 auto; padding: 40px 24px 96px; }
      a { color: var(--mark); }
      :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

      .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
      .brand { font-weight: 650; letter-spacing: -0.01em; font-size: 16px; }
      .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; }
      .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 999px; cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

      /* The specimen: what a reunion looks like on a real page. */
      .specimen { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 28px; align-items: start; margin: 0 0 64px; }
      .specimen blockquote { margin: 0; font: 21px/1.65 var(--serif); color: var(--ink); }
      .specimen cite { display: block; margin-top: 12px; font: 13px/1.4 var(--sans); font-style: normal; color: var(--muted); }
      .term {
        background: var(--mark-soft); border-radius: 2px;
        text-decoration: underline dashed 2px var(--mark); text-underline-offset: 5px; text-decoration-skip-ink: none;
        animation: mark 1s 400ms ease-out both;
      }
      @keyframes mark { from { text-decoration-color: transparent; background: transparent; } }
      .margin-note { border-left: 2px solid var(--mark); padding: 2px 0 2px 12px; font-size: 13px; color: var(--muted); margin-top: 38px; }
      .margin-note strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

      h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 10px; }
      .lede { color: var(--muted); font-size: 17px; margin: 0 0 48px; max-width: 34em; }

      .step { display: grid; grid-template-columns: 48px minmax(0, 1fr); padding: 32px 0; border-top: 1px solid var(--rule); }
      .step-no { font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
      h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 6px; }
      .hint { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

      .notes { list-style: none; margin: 0 0 20px; padding: 0; font-size: 14px; max-width: 62ch; }
      .notes li { padding: 9px 0 9px 20px; position: relative; border-bottom: 1px solid var(--rule); }
      .notes li::before { content: ""; position: absolute; left: 4px; top: 18px; width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }
      .check { display: flex; gap: 10px; align-items: center; font-weight: 550; cursor: pointer; width: fit-content; }
      .check input { width: 18px; height: 18px; accent-color: var(--mark); margin: 0; }

      .providers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
      .providers label { position: relative; display: block; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--field); }
      .providers input { position: absolute; opacity: 0; pointer-events: none; }
      .providers span { display: block; font-weight: 600; }
      .providers small { display: block; color: var(--muted); font-size: 12px; }
      .providers label:has(input:checked) { border-color: var(--mark); box-shadow: inset 0 0 0 1px var(--mark); }
      .providers label:has(input:focus-visible) { outline: 2px solid var(--mark); outline-offset: 2px; }

      .field { display: block; margin-bottom: 16px; max-width: 520px; }
      .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      .field input { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 11px; }
      .field input:focus { border-color: var(--mark); outline: none; box-shadow: 0 0 0 3px var(--mark-soft); }
      .field small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
      .row { display: flex; gap: 8px; align-items: flex-end; max-width: 520px; }
      .row .field { flex: 1; margin-bottom: 16px; }
      .row button { margin-bottom: 16px; }

      button.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--rule); background: var(--field); color: var(--ink); white-space: nowrap; }
      button.btn:hover { border-color: var(--muted); }
      button.primary { background: var(--mark); border-color: var(--mark); color: #fff; padding: 10px 22px; }
      @media (prefers-color-scheme: dark) { button.primary { color: #10152a; } }
      button.primary:hover { filter: brightness(1.08); border-color: var(--mark); }

      .result { white-space: pre-wrap; font-size: 14px; max-width: 620px; }
      .result:empty { display: none; }
      .result { margin: 4px 0 20px; padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--muted); background: var(--field); }
      .result[data-state="ok"] { border-left-color: var(--ok); }
      .result[data-state="error"] { border-left-color: var(--err); }
      .result[data-state="help"] { border-left-color: var(--err); font-family: var(--mono); font-size: 12.5px; overflow-x: auto; }

      .finish { display: flex; gap: 16px; align-items: center; padding-left: 48px; flex-wrap: wrap; }
      .finish .result { margin: 0; }

      .done h1 { margin-top: 8px; }
      kbd { font: 600 13px var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--field); }
      .next { list-style: none; padding: 0; margin: 0 0 32px; counter-reset: n; max-width: 34em; }
      .next li { counter-increment: n; padding: 12px 0 12px 36px; position: relative; border-top: 1px solid var(--rule); }
      .next li::before { content: counter(n); position: absolute; left: 0; top: 12px; font-weight: 600; color: var(--mark); }

      @media (max-width: 640px) {
        main { padding: 24px 16px 64px; }
        .top { margin-bottom: 36px; }
        .specimen { grid-template-columns: 1fr; gap: 12px; margin: 0 0 44px; }
        .specimen blockquote { font-size: 18px; }
        .margin-note { margin-top: 0; }
        h1 { font-size: 28px; }
        .step { grid-template-columns: 1fr; }
        .step-no { padding: 0 0 6px; }
        .providers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .row { flex-direction: column; align-items: stretch; }
        .finish { padding-left: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .term { animation: none; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
