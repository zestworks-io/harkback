<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harkback</title>
    <link rel="stylesheet" href="../../lib/ui/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      /* Chrome gives extension pages body { font-size: 75% }; set the size here, not on :root. */
      body {
        margin: 0;
        font: 15px/1.6 var(--sans);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 24px 96px;
      }
      a {
        color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 56px;
      }
      .brand {
        font-weight: 650;
        letter-spacing: -0.01em;
        font-size: 16px;
      }
      .lang-select {
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        padding: 3px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .seg button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--bg);
      }

      /* The specimen: what a reunion looks like on a real page. */
      .specimen {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 200px;
        gap: 28px;
        align-items: start;
        margin: 0 0 64px;
      }
      .specimen blockquote {
        margin: 0;
        font: 21px/1.65 var(--serif);
        color: var(--fg);
      }
      .specimen cite {
        display: block;
        margin-top: 12px;
        font: 13px/1.4 var(--sans);
        font-style: normal;
        color: var(--muted);
      }
      .sample {
        margin: -32px 0 56px;
      }
      .sample h2 {
        margin: 0 0 8px;
      }
      .sample-text {
        margin: 0 0 6px;
        font: 18px/1.65 var(--serif);
        color: var(--fg);
      }
      .sample-term {
        font: inherit;
        color: inherit;
        border: 0;
        cursor: pointer;
        padding: 0 2px;
      }
      .sample-card {
        margin-top: 12px;
        padding: 14px 18px;
        border: 1px solid var(--border, currentColor);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        font: 15px/1.6 var(--sans);
      }
      .sample-card[hidden] {
        display: none;
      }
      .sample-meta {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .sample-card p {
        margin: 0 0 8px;
      }
      .sample-next {
        color: var(--muted);
      }
      .term {
        background: var(--accent-soft);
        border-radius: 2px;
        text-decoration: underline dashed 2px var(--accent);
        text-underline-offset: 5px;
        text-decoration-skip-ink: none;
        animation: mark 1s 400ms ease-out both;
      }
      @keyframes mark {
        from {
          text-decoration-color: transparent;
          background: transparent;
        }
      }
      .margin-note {
        border-left: 2px solid var(--accent);
        padding: 2px 0 2px 12px;
        font-size: 13px;
        color: var(--muted);
        margin-top: 38px;
      }
      .margin-note strong {
        display: block;
        color: var(--fg);
        font-weight: 600;
        margin-bottom: 2px;
      }

      h1 {
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 700;
        margin: 0 0 10px;
      }
      .lede {
        color: var(--muted);
        font-size: 17px;
        margin: 0 0 48px;
        max-width: 34em;
      }

      .stepper {
        display: flex;
        gap: 8px;
        list-style: none;
        margin: 0 0 40px;
        padding: 0;
      }
      .stepper li {
        flex: 1;
        border-top: 2px solid var(--border);
        padding-top: 10px;
      }
      .stepper li.done,
      .stepper li.current {
        border-top-color: var(--accent);
      }
      .stepper-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
      }
      button.stepper-link {
        cursor: pointer;
      }
      button.stepper-link:hover .label {
        color: var(--fg);
      }
      .stepper .dot {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stepper li.current .stepper-link {
        color: var(--fg);
        font-weight: 600;
      }
      .stepper li.current .dot {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .stepper li.done .dot {
        border-color: var(--accent);
        color: var(--accent);
      }
      .panel {
        min-height: 280px;
      }
      .more-in-settings {
        margin: 8px 0 0;
      }
      h2 {
        font-size: 20px;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      .hint {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
      }

      .notes {
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
        font-size: 14px;
      }
      .notes li {
        padding: 9px 0 9px 20px;
        position: relative;
        border-bottom: 1px solid var(--border);
      }
      .notes li::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 18px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 550;
        cursor: pointer;
        width: fit-content;
      }
      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }
      .builtin {
        margin-bottom: 4px;
      }
      .providers {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
        margin-bottom: 20px;
      }
      .providers label {
        position: relative;
        display: block;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        background: var(--card);
      }
      .providers input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .providers span {
        display: block;
        font-weight: 600;
      }
      .providers small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .providers label:has(input:checked) {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .providers label:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .field {
        display: block;
        margin-bottom: 16px;
      }
      .field > span {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field select {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 11px;
      }
      .field input {
        width: 100%;
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 11px;
      }
      .field input:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .secret {
        display: flex;
        gap: 8px;
      }
      .secret input {
        flex: 1;
        min-width: 0;
      }
      .secret .reveal {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        min-width: 64px;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
      }
      .secret .reveal:hover {
        border-color: var(--muted);
      }
      .field small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .row .field {
        flex: 1;
        margin-bottom: 16px;
      }
      .row button {
        margin-bottom: 16px;
      }

      button.btn {
        font: inherit;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        white-space: nowrap;
      }
      button.btn:hover {
        border-color: var(--muted);
      }
      button.btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.btn:disabled:hover {
        border-color: var(--border);
        filter: none;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        padding: 10px 22px;
      }
      button.primary:hover {
        filter: brightness(1.08);
        border-color: var(--accent);
      }

      .result {
        white-space: pre-wrap;
        font-size: 14px;
      }
      .result:empty {
        display: none;
      }
      .result {
        margin: 4px 0 20px;
        padding: 10px 14px;
        border-radius: 8px;
        border-left: 3px solid var(--muted);
        background: var(--card);
      }
      .result[data-state="busy"]::before {
        content: "";
        display: inline-block;
        width: 0.9em;
        height: 0.9em;
        margin-right: 0.6em;
        vertical-align: -0.12em;
        border: 2px solid var(--muted);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .result[data-state="busy"]::before {
          animation-duration: 3s;
        }
      }
      .result[data-state="ok"] {
        border-left-color: var(--ok);
      }
      .result[data-state="error"] {
        border-left-color: var(--err);
      }
      .result[data-state="help"] {
        border-left-color: var(--err);
        font-family: var(--mono);
        font-size: 12.5px;
        overflow-x: auto;
      }

      .finish {
        display: flex;
        gap: 16px;
        align-items: center;
        padding-top: 24px;
        flex-wrap: wrap;
      }
      .finish .result {
        margin: 0;
      }

      .done h1 {
        margin-top: 8px;
      }
      kbd {
        font: 600 13px var(--mono);
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        background: var(--card);
      }
      .next {
        list-style: none;
        padding: 0;
        margin: 0 0 32px;
        counter-reset: n;
        max-width: 34em;
      }
      .next li {
        counter-increment: n;
        padding: 12px 0 12px 36px;
        position: relative;
        border-top: 1px solid var(--border);
      }
      .next li::before {
        content: counter(n);
        position: absolute;
        left: 0;
        top: 12px;
        font-weight: 600;
        color: var(--accent);
      }

      @media (max-width: 640px) {
        main {
          padding: 24px 16px 64px;
        }
        .top {
          margin-bottom: 36px;
        }
        .specimen {
          grid-template-columns: 1fr;
          gap: 12px;
          margin: 0 0 44px;
        }
        .specimen blockquote {
          font-size: 18px;
        }
        .margin-note {
          margin-top: 0;
        }
        h1 {
          font-size: 28px;
        }
        .stepper .label {
          display: none;
        }
        .stepper li.current .label {
          display: inline;
        }
        .providers {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .row {
          flex-direction: column;
          align-items: stretch;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .term {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
